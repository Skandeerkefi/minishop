name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [product-service, order-service, auth-service, api-gateway]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: npm test

      - name: Build Docker image
        run: docker build -t minishop-${{ matrix.service }} ./${{ matrix.service }}

  integration:
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start the Compose stack
        run: docker compose up --build -d

      - name: Check gateway health
        run: curl --fail --retry 10 --retry-delay 3 http://localhost:4000/health

      - name: Check product route
        run: curl --fail http://localhost:4000/api/products

      - name: Check auth route
        run: curl --fail http://localhost:4000/api/auth/health

      - name: Stop the Compose stack
        if: always()
        run: docker compose down -v
